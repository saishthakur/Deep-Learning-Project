name: Data pipeline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/reproducible-data-splits]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install data test dependencies
        run: python -m pip install pandas scikit-learn
      - name: Run data and split tests
        run: python -m unittest discover -s tests -v
